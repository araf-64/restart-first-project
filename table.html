<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Table</title>
    <style>
        caption {
        caption-side:top;
        padding-bottom: 10px;
        }
      table {
        border: 1px solid black;
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid black;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <h3>HTML Table</h3>
    <table>
        <caption>Employee Details</caption>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Company</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>John Doe</td>
          <td>Microsoft</td>
          <td>1000$</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Jane Doe</td>
          <td>Google</td>
          <td>2000$</td>
        </tr>
        <tr>
          <td>3</td>
          <td>John Smith</td>
          <td>Apple</td>
          <td>3000$</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
            <td colspan="3">Total</td>
            <td>6000$</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
